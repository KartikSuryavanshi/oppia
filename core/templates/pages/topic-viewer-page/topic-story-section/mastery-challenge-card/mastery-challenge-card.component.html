<div class="mastery-challenge-card"
  [class.mastery-challenge-card-unlocked]="isUnlocked"
  [attr.aria-label]="'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_TITLE' | translate">
  <div class="mastery-challenge-icon" aria-hidden="true">
    <img class="mastery-challenge-icon-image"
         src="/assets/images/icons/mastery-challenge-trophy.svg"
         alt=""
         aria-hidden="true">
  </div>
  <div class="mastery-challenge-content">
    <h3 class="mastery-challenge-title">{{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_TITLE' | translate }}</h3>
    <p class="mastery-challenge-description">{{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_DESCRIPTION' | translate }}</p>
  </div>
  <button class="mastery-challenge-button"
          type="button"
          [disabled]="!actionUrl"
          [class.locked]="!isUnlocked"
          (click)="navigateToAction()">
    <span *ngIf="isUnlocked" class="mastery-challenge-button-icon" aria-hidden="true">★</span>
    <span *ngIf="!isUnlocked" class="mastery-challenge-button-icon mastery-challenge-button-icon-material material-icons" aria-hidden="true">lock</span>
    <span>{{ isUnlocked ? ('I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_BUTTON' | translate) : 'Complete this story to unlock' }}</span>
  </button>
  <div class="mastery-challenge-helper-tooltip" *ngIf="showHelperTooltip" role="status" aria-live="polite">
    Let&apos;s complete this story first. Finish all chapters in order to unlock the Mastery Challenge.
  </div>
</div>
