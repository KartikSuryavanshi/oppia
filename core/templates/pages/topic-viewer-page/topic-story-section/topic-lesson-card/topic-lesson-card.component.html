<div class="topic-lesson-card" [class.topic-lesson-card-expanded]="isExpanded">
  <button class="topic-lesson-card-header"
          type="button"
          (click)="toggleExpanded()"
          [attr.aria-label]="getHeaderAriaLabel()"
          [attr.aria-expanded]="isExpanded">
    <span class="topic-lesson-card-number" *ngIf="lessonNumber > 0">
      {{ lessonNumber }}
    </span>
    <span class="topic-lesson-card-header-copy">
      <span class="topic-lesson-card-title">{{ lessonTitle }}</span>
      <span class="topic-lesson-card-description" *ngIf="!isExpanded">
        {{ lessonDescription }}
      </span>
    </span>
    <span class="topic-lesson-card-chevron" aria-hidden="true">
      {{ isExpanded ? '⌃' : '⌄' }}
    </span>
  </button>

  <div class="topic-lesson-card-body" *ngIf="isExpanded">
    <div class="topic-lesson-card-thumbnail">
      <img class="topic-lesson-card-image"
           [src]="resolvedThumbnailUrl"
           alt="{{ getThumbnailAltText() }}"
           title="{{ getThumbnailAltText() }}">
    </div>
    <div class="topic-lesson-card-content">
      <div class="topic-lesson-card-copy">
        <h3 class="topic-lesson-card-title topic-lesson-card-title-main">
          {{ lessonTitle }}
        </h3>
        <p class="topic-lesson-card-description topic-lesson-card-description-main">
          {{ lessonDescription }}
        </p>
      </div>
      <div class="topic-lesson-card-progress" *ngIf="showCheckpointBar">
        <oppia-checkpoint-bar
          [totalCheckpointsCount]="totalCheckpointsCount"
          [visitedCheckpointsCount]="visitedCheckpointsCount"
          [isReadOnly]="true">
        </oppia-checkpoint-bar>
      </div>
      <div class="topic-lesson-card-actions">
        <button class="topic-lesson-card-start-button topic-lesson-card-start-button-primary"
                type="button"
                [disabled]="!startUrl"
                (click)="navigateTo(startUrl)">
          {{ 'I18N_TOPIC_VIEWER_START' | translate }}
        </button>
        <button class="topic-lesson-card-start-button topic-lesson-card-start-button-secondary"
                type="button"
                [disabled]="!practiceUrl"
                (click)="navigateTo(practiceUrl)">
          Practice This Skill
        </button>
        <button class="topic-lesson-card-start-button topic-lesson-card-start-button-tertiary"
                type="button"
                [disabled]="!studyUrl"
                (click)="navigateTo(studyUrl)">
          View Study Guide
        </button>
      </div>
    </div>
  </div>
</div>
