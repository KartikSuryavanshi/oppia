<div class="adventure-navigation-container"
     *ngIf="adventureGroups.length > 0"
     [class.pinned]="isPinned"
     [class.desktop-fixed-header]="isPinned && shouldForceAllNodesVisibleOnDesktop()">
  <div class="adventure-navigation-scroll-area">
    <button class="adventure-navigation-arrow adventure-navigation-arrow--left"
            *ngIf="showLeftArrow && !shouldForceAllNodesVisibleOnDesktop()"
            (click)="scrollLeft()"
            aria-label="Scroll left"
            type="button">
      <i class="material-icons">chevron_left</i>
    </button>

    <div class="adventure-navigation-wrapper"
         [class.adventure-navigation-wrapper--centered]="!hasHorizontalOverflow"
         [class.adventure-navigation-wrapper--all-visible]="shouldForceAllNodesVisibleOnDesktop()"
          [class.dragging]="isDraggingToScroll"
         #scrollWrapper
          (mousedown)="onWrapperMouseDown($event)"
          (mousemove)="onWrapperMouseMove($event)"
          (mouseup)="onWrapperMouseUp()"
          (mouseleave)="onWrapperMouseUp()"
         (scroll)="onScroll()">
      <div class="adventure-navigation-group" *ngFor="let adventureGroup of adventureGroups; index as adventureIdx"
           [ngStyle]="{'border-color': adventureGroup.accentColor}">
        <button type="button"
                class="adventure-navigation-node-button"
                *ngFor="let lesson of adventureGroup.lessons"
                [attr.data-lesson-number]="lesson.lessonNumber"
          title="Go to lesson"
                [attr.aria-label]="'Go to lesson ' + lesson.lessonNumber"
                (click)="onLessonClick(lesson.lessonNumber)">
          <topic-adventure-circle-badge
                                        [label]="lesson.lessonNumber.toString()"
                                        [size]="'sm'"
                              [backgroundColor]="isActiveLesson(lesson.lessonNumber) ? adventureGroup.accentColor : '#fff'"
                                        [borderColor]="adventureGroup.accentColor"
                              [textColor]="isActiveLesson(lesson.lessonNumber) ? '#fff' : adventureGroup.accentColor"
                                        class="adventure-navigation-clickable">
          </topic-adventure-circle-badge>
        </button>

        <button type="button"
                class="adventure-navigation-node-button"
                *ngIf="adventureGroup.showPractice"
                [attr.data-practice-index]="adventureIdx"
          title="Go to practice"
                [attr.aria-label]="'Go to practice'"
                (click)="onPracticeClick(adventureIdx)">
          <topic-adventure-circle-badge
                              [iconName]="'edit'"
                                        [size]="'sm'"
                                        [backgroundColor]="'#fff'"
                                        [borderColor]="adventureGroup.accentColor"
                                        [textColor]="adventureGroup.accentColor"
                                        class="adventure-navigation-clickable">
          </topic-adventure-circle-badge>
        </button>
      </div>

      <div class="adventure-navigation-mastery-group">
        <topic-adventure-circle-badge class="adventure-navigation-mastery"
                                      [iconName]="'emoji_events'"
                                      [size]="'sm'"
                                      [backgroundColor]="'#fff7e8'"
                                      [borderColor]="'#f5a623'"
                                      [textColor]="'#f5a623'">
        </topic-adventure-circle-badge>
      </div>
    </div>

    <div class="adventure-navigation-edge-fade adventure-navigation-edge-fade-left"
         *ngIf="hasHorizontalOverflow && showLeftArrow && !shouldForceAllNodesVisibleOnDesktop()"
         aria-hidden="true"></div>
    <div class="adventure-navigation-edge-fade adventure-navigation-edge-fade-right"
         *ngIf="hasHorizontalOverflow && showRightArrow && !shouldForceAllNodesVisibleOnDesktop()"
         aria-hidden="true"></div>

    <button class="adventure-navigation-arrow adventure-navigation-arrow--right"
            *ngIf="showRightArrow && !shouldForceAllNodesVisibleOnDesktop()"
            (click)="scrollRight()"
            aria-label="Scroll right"
            type="button">
      <i class="material-icons">chevron_right</i>
    </button>
  </div>

  <p *ngIf="hasHorizontalOverflow && !shouldForceAllNodesVisibleOnDesktop()" class="adventure-navigation-hint">
    <span class="adventure-navigation-hint-arrow">&#8592;</span>
    {{ 'I18N_TOPIC_VIEWER_NAVIGATION_HINT' | translate }}
    <span class="adventure-navigation-hint-arrow">&#8594;</span>
  </p>
</div>
