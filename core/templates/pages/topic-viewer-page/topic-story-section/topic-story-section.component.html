<section class="topic-story-section"
         [attr.aria-label]="storyTitle ? ('Story section: ' + storyTitle) : 'Story section'">
  <div class="story-callout-row">
    <img class="story-callout-avatar"
         [src]="oppiaAvatarImageUrl"
         (error)="onAvatarImageError()"
         alt=""
         aria-hidden="true">
    <p *ngIf="storyDescription" class="story-description-bubble">
      <svg width="30" class="left-side-curve" height="24" viewBox="0 0 30 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" [ngStyle]="isLanguageRTL() ? {'transform': 'scaleX(-1)'} : {}">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M0.832031 0C12.8267 5.31326 22.692 13.4676 29.1014 23.3701V0H0.832031Z" fill="white" />
      </svg>
      {{ storyDescription }}
    </p>
  </div>

  <article class="story-card"
           [attr.aria-label]="storyTitle ? ('Story summary: ' + storyTitle) : 'Story summary'">
    <div class="story-card-header">
      <div class="story-card-header-left">
        <h3 class="story-title"><span class="story-label">Story: </span>“{{ storyTitle }}”</h3>
        <p class="story-meta" [attr.aria-label]="getStoryMetaAriaLabel()">
          {{ getStoryMetaText() }}
        </p>
      </div>
      <div class="story-card-header-right">
        <a class="study-skills-cta" [href]="studyGuideUrl" [attr.aria-label]="'I18N_TOPIC_VIEWER_STUDY_SKILLS_CTA_ARIA_LABEL' | translate: {storyTitle: storyTitle || 'this story'}">
          <img class="study-skills-icon"
               src="/assets/images/icons/study-skills-icon.png"
               alt=""
               aria-hidden="true">
          <span [innerHTML]="'I18N_TOPIC_VIEWER_STUDY_SKILLS_CTA' | translate"></span>
        </a>
      </div>
    </div>

    <div class="story-card-body">
      <div *ngFor="let arc of arcs; let i = index" class="arc-section">
        <button class="arc-header"
                (click)="toggleArc(i)"
                [attr.aria-expanded]="!isArcCollapsed(i)"
                [attr.aria-label]="'Arc: ' + arc.title">
          <span class="arc-header-left">
            <span class="arc-title">{{ arc.title }}</span>
            <span class="arc-lesson-count">{{ arc.node_ids.length }} lesson{{ arc.node_ids.length === 1 ? '' : 's' }}</span>
          </span>
          <span class="arc-header-right">
            <span *ngIf="arc.description" class="arc-description-preview">{{ arc.description }}</span>
            <span class="arc-chevron" [class.arc-chevron--collapsed]="isArcCollapsed(i)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </span>
        </button>
        <div class="arc-body" *ngIf="!isArcCollapsed(i)">
          <p *ngIf="arc.description" class="arc-description">{{ arc.description }}</p>
          <div class="arc-lessons-list">
            <topic-lesson-card
              *ngFor="let lesson of getNodesForArc(arc)"
              [lessonTitle]="lesson.getTitle()"
              [lessonDescription]="lesson.getDescription()"
              [thumbnailUrl]="getThumbnailUrl(lesson)"
              [startUrl]="getExplorationUrl(lesson)">
            </topic-lesson-card>
          </div>
        </div>
      </div>
      <div *ngIf="arcs.length === 0" class="no-arcs-placeholder">
        <p class="no-arcs-text">All chapters</p>
      </div>
    </div>
  </article>
</section>
